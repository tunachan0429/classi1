<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>モック 2段階ログインページ</title>
  <style>
    body { font-family: sans-serif; padding: 24px; }
    label { display: block; margin: 8px 0; }
    input { padding: 6px; }
    /* パスワード欄は最初は非表示(DOMには存在するが見えない) */
    #pass-step { display: none; }
    #msg { color: green; font-weight: bold; margin-top: 12px; }
  </style>
</head>
<body>
  <h1>ログイン(2段階・モック)</h1>
  <form id="login-form" onsubmit="return onSubmit(event)">
    <!-- ステップ1: ユーザー名 -->
    <div id="user-step">
      <label>ユーザー名: <input type="text" name="username"></label>
    </div>
    <!-- ステップ2: パスワード(最初は display:none で非表示) -->
    <div id="pass-step">
      <label>パスワード: <input type="password" name="password"></label>
    </div>
    <button type="submit" id="submit-btn">次へ</button>
  </form>
  <div id="after" style="display:none">
    <p id="msg">ログイン成功</p>
    <a id="dashboard" href="#">ダッシュボード</a>
  </div>
  <script>
    let step = 1;
    function onSubmit(e) {
      e.preventDefault();
      if (step === 1) {
        // ユーザー名を確認してパスワード欄を表示
        const u = document.querySelector('input[name=username]').value;
        if (!u) { alert('ユーザー名を入力してください'); return false; }
        document.getElementById('pass-step').style.display = 'block';
        document.getElementById('submit-btn').textContent = 'ログイン';
        step = 2;
      } else {
        // パスワードを確認してログイン
        const u = document.querySelector('input[name=username]').value;
        const p = document.querySelector('input[name=password]').value;
        if (u === 'testuser' && p === 'testpass') {
          document.getElementById('login-form').style.display = 'none';
          document.getElementById('after').style.display = 'block';
        } else {
          alert('ユーザー名かパスワードが違います');
        }
      }
      return false;
    }
  </script>
</body>
</html>
